# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com
version: 2
project_name: slackdump
before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy
builds:
  - id: slackdump
    env:
      - CGO_ENABLED=0
    # Windows and macOS are the targets this fork exists for; Linux comes
    # along at no extra cost.  Dropping freebsd/openbsd and 32-bit x86 keeps
    # the release to six artifacts people actually download.
    goos:
      - windows
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    main: ./cmd/slackdump

archives:
  - id: default
    formats: [ 'tar.gz' ]
    # this name template makes the OS and Arch compatible with the results of uname.
    name_template: >-
      {{ .ProjectName }}_
      {{- if eq .Os "darwin"}}macOS{{ else }}{{ title .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
    - goos: windows
      formats:
        - zip
    files:
      - LICENSE
      - README.md
      - slackdump.1
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  # Fork tags carry a -viewer.N suffix, which semver reads as a pre-release of
  # the upstream version they are built from.  That is backwards -- they are
  # upstream plus viewer features -- and left on "auto" it would cost the
  # release its "Latest" badge on GitHub.  State it outright.
  prerelease: false

